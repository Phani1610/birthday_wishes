<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripShare - Ride Sharing</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container">
            <h1>TripShare</h1>
            <p>Share your ride or find one easily</p>
        </div>
    </header>

    <div id="homePage" class="container card">
        <h2>Create a Trip</h2>
        <form id="tripForm">
            <div class="form-group">
                <label for="origin">Origin</label>
                <input type="text" id="origin" required>
            </div>
            <div class="form-group">
                <label for="destination">Destination</label>
                <input type="text" id="destination" required>
            </div>
            <div class="form-group">
                <label for="date">Date & Time</label>
                <input type="datetime-local" id="date" required>
            </div>
            <div class="form-group">
                <label for="seats">Seats Available</label>
                <input type="number" id="seats" min="1" required>
            </div>
            <div class="form-group">
                <label for="cost">Cost per Seat (₹)</label>
                <input type="number" id="cost" min="1" required>
            </div>
            <div class="form-group">
                <label for="vehicleNumber">Vehicle Number</label>
                <input type="text" id="vehicleNumber" placeholder="e.g., AP39AB1234" required>
            </div>
            <div class="form-group">
                <label for="vehicleType">Vehicle Type</label>
                <input type="text" id="vehicleType" placeholder="e.g., Car, Bike, Van" required>
            </div>
            <div class="form-group">
                <label for="contactNumber">Contact Number</label>
                <input type="tel" id="contactNumber" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
            </div>
            <button type="submit" class="btn btn-primary">Create Trip</button>
        </form>
    </div>

    <div id="searchPage" class="container card">
        <h2>Search Trips</h2>
        <div class="search-bar">
            <input type="text" id="searchDest" placeholder="Enter destination...">
            <button onclick="searchTrips()" class="btn btn-search">Search</button>
        </div>
        <div id="results"></div>
    </div>

    <div id="paymentPage" class="container card hidden">
        <h2>Trip Summary</h2>
        <div class="trip-summary" id="tripSummary"></div>

        <h2>Payment Details</h2>
        <form id="paymentForm">
            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" readonly required>
            </div>
            <div class="form-group">
                <label for="paymentMethod">Payment Method</label>
                <select id="paymentMethod" required>
                    <option value="">-- Select --</option>
                    <option value="upi">UPI</option>
                    <option value="card">Credit/Debit Card</option>
                    <option value="cash">Cash</option>
                </select>
            </div>
            <div class="form-group">
                <label for="txnId">Transaction ID (if applicable)</label>
                <input type="text" id="txnId" placeholder="Enter Transaction ID">
            </div>
            <button type="submit" class="btn btn-primary">Confirm Payment</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
