<!DOCTYPE html>
<html>
    <head>
        <title>My webpage</title>
    </head>
    <body>
        <h3>Internship form</h3>
        <form method="POST">
            <p>Enter your name:</p>
            <input type="text" name="Nmae"/>
            <p>Enter your email:</p>
            <input type="email" name="email"/>
            <p>Enter ypur password:</p>
            <input type="password" name="password"/>
            <p>Enter your age:</p>
            <input type="number" name="age"/>
            <p>Gender</p>
            <input type="radio"  id="male"  name="gender" value="male"/>Male 
            <input type="radio"  id="female"  name="gender" value="female"/>female
            <input type="radio" id="other" name="gender" value="other"/>Other
            <p>About yourself</p>
            <textarea rows="2" cols="20" name="description"></textarea>
            <p>Which programming language should you know</p>
            <input type="checkbox" name="C" value="on"/>C<br>
            <input type="checkbox" name="C++" value="on"/>C++<br>
            <input type="checkbox" name="Python" value="on"/>Python<br>
            <input type="checkbox" name="Java" value="on"/>Java<br>
            <input type="checkbox" name="HTML" value="on"/>HTML<br>
            <p>How many months you want to participate in our internship program?</p>
            <select name="dropdown">
                <option value="3 months">3 months</option>
                <option vlaue="6 months">6 months</option>
                <option value="9 months">9 months</option>
                <option value="12 months">12 months</option>
            </select>
            <p>Upload your resume</p>
            <input type="file" name="fileupload" accept=""document/*/>
            <p></p>
            <a href="secondwebpage.html"><input type="button" onclick="alert('check your information')" name="submit" value="submit"/></a>


        </form>
    </body>
    <style>
        body{
            background-color: pink;
        }
        
    </style>
</html>
