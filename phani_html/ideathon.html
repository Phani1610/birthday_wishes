<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Hub - Login & Registration</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    h1 {
      color: #fff;
      text-align: center;
      font-size: 36px;
      margin-bottom: 25px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
    }

    .container {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 900px;
      display: flex;
      overflow: hidden;
      transition: all 0.5s ease;
    }

    .login-box, .register-box {
      flex: 1;
      padding: 40px;
    }

    .login-box h2, .register-box h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #444;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #2575fc;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #1a5fd1;
    }

    .divider {
      width: 2px;
      background: #eee;
      margin: 0 10px;
    }

    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #666;
    }

    .footer a {
      color: #2575fc;
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .divider {
        display: none;
      }
    }
  </style>
</head>
<body>
  <h1>🎓 College Hub</h1>

  <div class="container">
    <!-- Student Login -->
    <div class="login-box" id="student-login">
      <h2>Student Login</h2>
      <form onsubmit="return studentLogin()">
        <label>Student ID</label>
        <input type="text" id="studentId" placeholder="Enter your Student ID" required>

        <label>Password</label>
        <input type="password" id="studentPassword" placeholder="Enter your Password" required>

        <button type="submit">Login</button>
        <div class="footer">
          Not registered? <a href="#" onclick="showStudentRegister()">Register Here</a>
        </div>
      </form>
    </div>

    <div class="divider"></div>

    <!-- College Login -->
    <div class="login-box" id="college-login">
      <h2>College Login</h2>
      <form onsubmit="return collegeLogin()">
        <label>College Code</label>
        <input type="text" id="collegeCode" placeholder="Enter College Code" required>

        <label>Password</label>
        <input type="password" id="collegePassword" placeholder="Enter Password" required>

        <button type="submit">Login</button>
        <div class="footer">
          New college? <a href="#" onclick="showCollegeRegister()">Register Here</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Student Registration -->
  <div class="register-box hidden" id="student-register">
    <h2>Student Registration</h2>
    <form onsubmit="return registerStudent()">
      <label>Full Name</label>
      <input type="text" id="sName" placeholder="Enter your name" required>

      <label>Student ID</label>
      <input type="text" id="sId" placeholder="Create Student ID" required>

      <label>Email</label>
      <input type="text" id="sEmail" placeholder="Enter your email" required>

      <label>Course</label>
      <select id="sCourse" required>
        <option value="">Select Course</option>
        <option value="CSE">CSE</option>
        <option value="CSM">CSM</option>
        <option value="ECE">ECE</option>
        <option value="EEE">EEE</option>
        <option value="MECH">MECH</option>
      </select>

      <label>Password</label>
      <input type="password" id="sPassword" placeholder="Create Password" required>

      <button type="submit">Register</button>
      <div class="footer">
        Already registered? <a href="#" onclick="showLogin()">Login Here</a>
      </div>
    </form>
  </div>

  <!-- College Registration -->
  <div class="register-box hidden" id="college-register">
    <h2>College Registration</h2>
    <form onsubmit="return registerCollege()">
      <label>College Name</label>
      <input type="text" id="cName" placeholder="Enter College Name" required>

      <label>College Code</label>
      <input type="text" id="cCode" placeholder="Create College Code" required>

      <label>Admin Email</label>
      <input type="text" id="cEmail" placeholder="Enter Admin Email" required>

      <label>Location</label>
      <input type="text" id="cLocation" placeholder="Enter College Location" required>

      <label>Password</label>
      <input type="password" id="cPassword" placeholder="Create Password" required>

      <button type="submit">Register</button>
      <div class="footer">
        Already registered? <a href="#" onclick="showLogin()">Login Here</a>
      </div>
    </form>
  </div>

  <script>
    // Toggle forms
    function showStudentRegister() {
      document.querySelector(".container").classList.add("hidden");
      document.getElementById("college-register").classList.add("hidden");
      document.getElementById("student-register").classList.remove("hidden");
    }

    function showCollegeRegister() {
      document.querySelector(".container").classList.add("hidden");
      document.getElementById("student-register").classList.add("hidden");
      document.getElementById("college-register").classList.remove("hidden");
    }

    function showLogin() {
      document.querySelector(".container").classList.remove("hidden");
      document.getElementById("student-register").classList.add("hidden");
      document.getElementById("college-register").classList.add("hidden");
    }

    // Dummy login validation
    function studentLogin() {
      const id = document.getElementById("studentId").value;
      const pass = document.getElementById("studentPassword").value;

      if (id === "student123" && pass === "1234") {
        alert("✅ Student login successful!");
      } else {
        alert("❌ Invalid Student ID or Password!");
      }
      return false;
    }

    function collegeLogin() {
      const code = document.getElementById("collegeCode").value;
      const pass = document.getElementById("collegePassword").value;

      if (code === "NSRIT" && pass === "admin123") {
        alert("✅ College login successful!");
      } else {
        alert("❌ Invalid College Code or Password!");
      }
      return false;
    }

    // Registration
    function registerStudent() {
      const name = document.getElementById("sName").value;
      const id = document.getElementById("sId").value;
      const email = document.getElementById("sEmail").value;
      const course = document.getElementById("sCourse").value;
      const pass = document.getElementById("sPassword").value;

      if (name && id && email && course && pass) {
        alert("✅ Student registered successfully!");
        showLogin();
      } else {
        alert("❌ Please fill all fields!");
      }
      return false;
    }

    function registerCollege() {
      const name = document.getElementById("cName").value;
      const code = document.getElementById("cCode").value;
      const email = document.getElementById("cEmail").value;
      const loc = document.getElementById("cLocation").value;
      const pass = document.getElementById("cPassword").value;

      if (name && code && email && loc && pass) {
        alert("✅ College registered successfully!");
        showLogin();
      } else {
        alert("❌ Please fill all fields!");
      }
      return false;
    }
  </script>
</body>
</html>
