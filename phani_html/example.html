<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TripShare - Ride Sharing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fa;
      margin: 0; padding: 0;
    }
    header {
      background: #2c3e50; color: #fff;
      padding: 15px; text-align: center;
    }
    nav { background: #34495e; padding: 10px; text-align: center; }
    nav a {
      color: #fff; margin: 0 10px; text-decoration: none; font-weight: bold;
    }
    nav a:hover { text-decoration: underline; }
    section { display: none; padding: 20px; }
    section.active { display: block; }
    form { background: #fff; padding: 20px; border-radius: 8px;
           max-width: 400px; margin: auto; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    input, select, button {
      width: 100%; padding: 10px; margin: 10px 0;
      border: 1px solid #ccc; border-radius: 4px;
    }
    button { background: #3498db; color: #fff; border: none; cursor: pointer; }
    button:hover { background: #2980b9; }
    .trip-card {
      background: #fff; margin: 10px auto; padding: 15px; border-radius: 8px;
      max-width: 500px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .trip-card h3 { margin-top: 0; }
    .summary { background: #ecf0f1; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <header><h1>🚗 TripShare</h1></header>
  <nav>
    <a href="#home">Home</a>
    <a href="#driver">Driver</a>
    <a href="#passenger">Passenger</a>
    <a href="#search">Search</a>
    <a href="#payment">Payment</a>
    <a href="#tracking">Tracking</a>
  </nav>

  <section id="home" class="active">
    <h2>Welcome to TripShare</h2>
    <p>Connect with drivers and passengers to share rides easily!</p>
  </section>

  <!-- Driver Registration -->
  <section id="driver">
    <h2>Driver Registration</h2>
    <form id="driverForm">
      <input type="text" id="driverName" placeholder="Your Name" required>
      <input type="text" id="vehicleNumber" placeholder="Vehicle Number" required>
      <input type="text" id="vehicleType" placeholder="Vehicle Type" required>
      <input type="text" id="origin" placeholder="Origin" required>
      <input type="text" id="destination" placeholder="Destination" required>
      <input type="datetime-local" id="date" required>
      <input type="number" id="seats" placeholder="Seats Available" required min="1">
      <input type="number" id="cost" placeholder="Cost per Seat (₹)" required min="0">
      <input type="text" id="contactNumber" placeholder="Contact Number" required>
      <button type="submit">Register Trip</button>
    </form>
  </section>

  <!-- Passenger Request -->
  <section id="passenger">
    <h2>Request a Ride</h2>
    <form id="passengerForm">
      <input type="text" id="passengerName" placeholder="Your Name" required>
      <input type="text" id="pOrigin" placeholder="Origin" required>
      <input type="text" id="pDestination" placeholder="Destination" required>
      <input type="datetime-local" id="pDate" required>
      <button type="submit">Request</button>
    </form>
  </section>

  <!-- Search -->
  <section id="search">
    <h2>Find a Trip</h2>
    <form id="searchForm">
      <input type="text" id="searchOrigin" placeholder="Origin">
      <input type="text" id="searchDestination" placeholder="Destination">
      <button type="submit">Search</button>
    </form>
    <div id="searchResults"></div>
  </section>

  <!-- Payment -->
  <section id="payment">
    <h2>Payment</h2>
    <div class="summary" id="tripSummary"></div>
    <form id="paymentForm">
      <label for="amount">Amount (₹)</label>
      <input type="number" id="amount" readonly>
      <label for="paymentMethod">Method</label>
      <select id="paymentMethod" required>
        <option value="">Select</option>
        <option value="upi">UPI</option>
        <option value="card">Card</option>
        <option value="cash">Cash</option>
      </select>
      <input type="text" id="txnId" placeholder="Transaction ID (if applicable)">
      <button type="submit">Confirm Payment</button>
    </form>
  </section>

  <!-- Tracking -->
  <section id="tracking">
    <h2>Track Vehicle</h2>
    <form id="trackingForm">
      <input type="text" id="trackVehicle" placeholder="Enter Vehicle Number" required>
      <button type="submit">Track</button>
    </form>
    <div id="trackingResult"></div>
  </section>

<script>
  /* ---------- Utilities ---------- */
  const loadTrips = () => JSON.parse(localStorage.getItem('trips')||'[]');
  const saveTrips = (arr) => localStorage.setItem('trips', JSON.stringify(arr));
  const setSelectedTripId = (id) => localStorage.setItem('selectedTripId', id);
  const getSelectedTripId = () => localStorage.getItem('selectedTripId');
  const clearSelectedTripId = () => localStorage.removeItem('selectedTripId');
  const formatLocal = (d) => new Date(d).toLocaleString();

  function addKV(container, key, val) {
    const p = document.createElement('p');
    p.innerHTML = `<b>${key}:</b> ${val}`;
    container.appendChild(p);
  }

  /* ---------- Routing ---------- */
  const sections = document.querySelectorAll('section');
  function showPage(hash) {
    sections.forEach(s=>s.classList.remove('active'));
    const id = hash.replace('#','')||'home';
    document.getElementById(id).classList.add('active');
  }
  window.addEventListener('hashchange', ()=>showPage(location.hash));
  showPage(location.hash);

  /* ---------- Driver Form ---------- */
  document.getElementById('driverForm').addEventListener('submit', e=>{
    e.preventDefault();
    const trip = {
      id: Date.now(),
      driverName: driverName.value,
      vehicleNumber: vehicleNumber.value,
      vehicleType: vehicleType.value,
      origin: origin.value,
      destination: destination.value,
      date: date.value,
      seats: +seats.value,
      cost: +cost.value,
      contactNumber: contactNumber.value
    };
    const trips = loadTrips();
    trips.push(trip); saveTrips(trips);
    alert('✅ Trip Registered');
    e.target.reset();
    location.hash = '#search';
  });

  /* ---------- Passenger Form ---------- */
  document.getElementById('passengerForm').addEventListener('submit', e=>{
    e.preventDefault();
    alert(`Ride Requested from ${pOrigin.value} to ${pDestination.value}`);
    e.target.reset();
  });

  /* ---------- Search ---------- */
  document.getElementById('searchForm').addEventListener('submit', e=>{
    e.preventDefault();
    const from = searchOrigin.value.toLowerCase(), to = searchDestination.value.toLowerCase();
    const trips = loadTrips().filter(t=>
      (!from || t.origin.toLowerCase().includes(from)) &&
      (!to || t.destination.toLowerCase().includes(to))
    );
    const results = document.getElementById('searchResults');
    results.innerHTML='';
    if (!trips.length) { results.textContent='❌ No trips found.'; return; }
    trips.forEach(t=>{
      const card=document.createElement('div'); card.className='trip-card';
      card.innerHTML=`
        <h3>${t.origin} → ${t.destination}</h3>
        <p><b>Driver:</b> ${t.driverName}</p>
        <p><b>Date:</b> ${formatLocal(t.date)}</p>
        <p><b>Seats:</b> ${t.seats}</p>
        <p><b>Cost:</b> ₹${t.cost}</p>
        <button>Select</button>`;
      card.querySelector('button').onclick=()=>{
        setSelectedTripId(t.id); location.hash='#payment';
      };
      results.appendChild(card);
    });
  });

  /* ---------- Payment ---------- */
  let paymentInit=false;
  function initPaymentPage() {
    if(paymentInit) return; paymentInit=true;
    const summary=document.getElementById('tripSummary');
    const amountEl=document.getElementById('amount');
    const form=document.getElementById('paymentForm');

    function loadSummary(){
      const selId=getSelectedTripId();
      const trips=loadTrips();
      summary.innerHTML='';
      if(!selId){ summary.textContent='No trip selected.'; amountEl.value=''; return;}
      const trip=trips.find(t=>t.id==selId);
      if(!trip){ summary.textContent='Trip not found.'; amountEl.value=''; return;}
      addKV(summary,'Driver',trip.driverName);
      addKV(summary,'From',trip.origin);
      addKV(summary,'To',trip.destination);
      addKV(summary,'Date',formatLocal(trip.date));
      addKV(summary,'Seats',trip.seats);
      addKV(summary,'Cost',`₹${trip.cost}`);
      addKV(summary,'Vehicle',`${trip.vehicleType} (${trip.vehicleNumber})`);
      addKV(summary,'Contact',trip.contactNumber);
      amountEl.value=trip.cost;
    }
    loadSummary();

    form.addEventListener('submit',e=>{
      e.preventDefault();
      if(!paymentMethod.value) return alert('Select payment method');
      alert('✅ Payment Confirmed via '+paymentMethod.value.toUpperCase());
      clearSelectedTripId(); form.reset(); location.hash='#home';
    });
  }
  window.addEventListener('hashchange',()=>{if(location.hash==='#payment') initPaymentPage();});

  /* ---------- Tracking ---------- */
  document.getElementById('trackingForm').addEventListener('submit', e=>{
    e.preventDefault();
    const num=trackVehicle.value.trim();
    const trips=loadTrips();
    const trip=trips.find(t=>t.vehicleNumber.toLowerCase()===num.toLowerCase());
    const result=document.getElementById('trackingResult');
    if(!trip){ result.textContent='❌ Vehicle not found.'; return;}
    let status=0;
    result.textContent=`Tracking ${trip.vehicleNumber}: Starting from ${trip.origin}`;
    const interval=setInterval(()=>{
      status++;
      if(status===1) result.textContent=`${trip.vehicleNumber}: On route to ${trip.destination}...`;
      if(status===2) result.textContent=`${trip.vehicleNumber}: Almost at ${trip.destination}`;
      if(status===3){ result.textContent=`${trip.vehicleNumber}: ✅ Arrived at ${trip.destination}`; clearInterval(interval);}
    },3000);
  });
</script>
</body>
</html
