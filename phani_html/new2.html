<!-- donate-board.html -->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Donate Board</title>
<style>
  body{font-family: Arial;max-width:760px;margin:24px auto;padding:0 16px}
  form{display:flex;gap:8px;margin-bottom:12px}
  input,textarea{padding:8px;border:1px solid #ccc;border-radius:6px}
  .post{border:1px solid #eee;padding:10px;border-radius:8px;margin-bottom:8px}
  .meta{font-size:.85rem;color:#666}
  button{padding:6px 10px;border-radius:6px}
</style>
</head>
<body>
  <h1>Food Donation Board</h1>
  <form id="postForm">
    <input id="item" placeholder="Item (e.g., 2 boxes of cooked rice)" required />
    <input id="when" placeholder="Pickup time" />
    <button type="submit">Post</button>
  </form>
  <div id="feed"></div>

<script>
const form = document.getElementById('postForm');
const feed = document.getElementById('feed');

function load(){ return JSON.parse(localStorage.getItem('donations')||'[]'); }
function save(arr){ localStorage.setItem('donations', JSON.stringify(arr)); }

function render(){
  const data = load();
  feed.innerHTML = data.map((p,i)=>`
    <div class="post"><div><strong>${escapeHtml(p.item)}</strong></div>
    <div class="meta">Posted at ${new Date(p.ts).toLocaleString()} ${p.when? ' • Pickup: '+escapeHtml(p.when):''}</div>
    <div style="margin-top:6px"><button data-i="${i}" class="claim">Claim</button></div>
    </div>`).join('');
  document.querySelectorAll('.claim').forEach(btn=>btn.onclick = ()=> {
    const idx = Number(btn.dataset.i);
    if(confirm('Mark as claimed?')) { const d = load(); d.splice(idx,1); save(d); render(); }
  });
}

form.onsubmit = e => {
  e.preventDefault();
  const item = document.getElementById('item').value.trim();
  const when = document.getElementById('when').value.trim();
  if(!item) return alert('Give an item');
  const arr = load();
  arr.unshift({item,when,ts:Date.now()});
  save(arr);
  form.reset();
  render();
};

function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

render();
</script>
</body>
</html>
