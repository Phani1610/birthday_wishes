<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripShare with SQL</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/sql-wasm.js"></script>
  <style>
    /* Base Styles */
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: #eef2f7;
      color: #333;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #2c3e50, #34495e);
      color: #fff;
      padding: 25px;
      text-align: center;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
    }
    header h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    /* Container */
    .container {
      max-width: 850px;
      margin: 25px auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
      color: #2c3e50;
      border-bottom: 2px solid #27ae60;
      padding-bottom: 6px;
    }

    /* Form Inputs */
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: 600;
      color: #444;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      transition: border 0.2s ease;
    }
    input:focus {
      border-color: #27ae60;
      outline: none;
      box-shadow: 0 0 6px rgba(39, 174, 96, 0.3);
    }

    /* Button */
    button {
      width: 100%;
      padding: 12px;
      background: #27ae60;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
    }
    button:hover {
      background: #219150;
    }
    button:active {
      transform: scale(0.97);
    }

    /* Trip Card */
    .trip {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 12px 0;
      border-radius: 10px;
      background: #fafafa;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .trip:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }
    .trip p {
      margin: 6px 0;
      font-size: 0.95rem;
    }
    .trip strong {
      color: #2c3e50;
    }

    /* Search Results */
    #results {
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🚗 TripShare </h1>
  </header>

  <div class="container">
    <h2>Create a Trip (Driver)</h2>
    <form id="tripForm">
      <label>Driver Name</label>
      <input type="text" id="driverName" required />
      <label>Origin</label>
      <input type="text" id="origin" required />
      <label>Destination</label>
      <input type="text" id="destination" required />
      <label>Date & Time</label>
      <input type="datetime-local" id="date" required />
      <label>Seats</label>
      <input type="number" id="seats" required />
      <label>Cost (₹)</label>
      <input type="number" id="cost" required />
      <label>Vehicle Number</label>
      <input type="text" id="vehicleNumber" required />
      <label>Vehicle Type</label>
      <input type="text" id="vehicleType" required />
      <label>Contact Number</label>
      <input type="tel" id="contactNumber" required />
      <button type="submit">Create Trip</button>
    </form>
  </div>

  <div class="container">
    <h2>Search Trips</h2>
    <input type="text" id="searchDest" placeholder="Enter destination..." />
    <button id="btnSearchTrips">Search</button>
    <div id="results"></div>
  </div>

  <script>
    let db;

    // Load SQL.js and create DB
    initSqlJs().then(SQL => {
      db = new SQL.Database();
      db.run(`CREATE TABLE trips (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        driverName TEXT, origin TEXT, destination TEXT,
        date TEXT, seats INTEGER, cost REAL,
        vehicleNumber TEXT, vehicleType TEXT, contactNumber TEXT
      );`);
    });

    // Handle trip form
    document.getElementById("tripForm").addEventListener("submit", e => {
      e.preventDefault();
      const stmt = db.prepare(`INSERT INTO trips 
        (driverName, origin, destination, date, seats, cost, vehicleNumber, vehicleType, contactNumber) 
        VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)`);
      stmt.run([
        document.getElementById("driverName").value,
        document.getElementById("origin").value,
        document.getElementById("destination").value,
        document.getElementById("date").value,
        document.getElementById("seats").value,
        document.getElementById("cost").value,
        document.getElementById("vehicleNumber").value,
        document.getElementById("vehicleType").value,
        document.getElementById("contactNumber").value
      ]);
      stmt.free();
      alert("✅ Trip saved in SQL database!");
      e.target.reset();
    });

    // Search trips
    document.getElementById("btnSearchTrips").addEventListener("click", () => {
      const dest = document.getElementById("searchDest").value.toLowerCase();
      const results = db.exec("SELECT * FROM trips");
      const container = document.getElementById("results");
      container.innerHTML = "";
      if (results.length === 0) {
        container.textContent = "No trips found.";
        return;
      }
      const rows = results[0].values.filter(r => !dest || r[3].toLowerCase().includes(dest));
      rows.forEach(r => {
        const div = document.createElement("div");
        div.className = "trip";
        div.innerHTML = `
          <p><strong>Driver:</strong> ${r[1]}</p>
          <p><strong>From:</strong> ${r[2]} → <strong>To:</strong> ${r[3]}</p>
          <p><strong>Date:</strong> ${r[4]}</p>
          <p><strong>Seats:</strong> ${r[5]}</p>
          <p><strong>Cost:</strong> ₹${r[6]}</p>
          <p><strong>Vehicle:</strong> ${r[7]} (${r[8]})</p>
          <p><strong>Contact:</strong> ${r[9]}</p>
        `;
        container.appendChild(div);
      });
    });
  </script>
</body>
</html>
