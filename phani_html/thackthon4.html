<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripShare - Ride Sharing App</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --background-color: #f0f2f5;
            --container-bg: #ffffff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--background-color);
            margin: 0;
            padding: 0;
            color: #333;
            line-height: 1.6;
        }

        header {
            background: var(--secondary-color);
            color: white;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 25px;
            background: var(--container-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: var(--primary-color);
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .tab-menu {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .tab-menu button {
            flex: 1;
            padding: 12px;
            background: #e9ecef;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: #555;
            transition: all 0.3s ease;
            border-radius: 8px 8px 0 0;
        }

        .tab-menu button.active {
            background: var(--primary-color);
            color: white;
            font-weight: bold;
        }
        
        .tab-menu button:not(.active):hover {
            background: #d9dee3;
        }

        form label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
        }
        
        form input, form select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        form input:focus, form select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }

        button.primary-btn {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: var(--success-color);
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background 0.3s ease;
        }

        button.primary-btn:hover {
            background: #27ae60;
        }

        #results {
            margin-top: 20px;
        }
        
        .trip-card {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .trip-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }
        
        .trip-card p {
            margin: 5px 0;
        }
        
        .trip-card strong {
            color: var(--secondary-color);
        }

        .trip-card .join-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .trip-card .join-btn:hover {
            background: #2980b9;
        }
        
        .hidden {
            display: none;
        }

        .alert-message {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .trip-summary {
            padding: 20px;
            background: #f0f4f8;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1><span role="img" aria-label="car emoji">🚗</span> TripShare</h1>
        <p>Your easy way to share rides and save money!</p>
    </header>

    <div class="container">
        <div class="tab-menu">
            <button id="createTripBtn" class="active">Create a Trip</button>
            <button id="searchTripsBtn">Find a Ride</button>
        </div>

        <div id="createTripSection" class="tab-content">
            <h2>Create a New Trip</h2>
            <form id="tripForm">
                <label for="origin">Origin</label>
                <input type="text" id="origin" required>
                
                <label for="destination">Destination</label>
                <input type="text" id="destination" required>
                
                <label for="date">Date & Time</label>
                <input type="datetime-local" id="date" required>
                
                <label for="seats">Seats Available</label>
                <input type="number" id="seats" min="1" required>
                
                <label for="cost">Cost per Seat (₹)</label>
                <input type="numbers" id="cost" min="1" required>
                
                <label for="vehicleNumber">Vehicle Number</label>
                <input type="text" id="vehicleNumber" placeholder="e.g., AP39AB1234" required>
                
                <label for="vehicleType">Vehicle Type</label>
                <input type="text" id="vehicleType" placeholder="e.g., Car, Bike, Van" required>
                
                <label for="contactNumber">Contact Number</label>
                <input type="tel" id="contactNumber" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
                
                <button type="submit" class="primary-btn">Create Trip</button>
            </form>
        </div>

        <div id="searchTripsSection" class="tab-content hidden">
            <h2>Find a Ride</h2>
            <label for="searchDest">Search by Destination</label>
            <input type="text" id="searchDest" placeholder="Enter destination...">
            <button class="primary-btn" onclick="searchTrips()">Search</button>
            <div id="results"></div>
        </div>
    </div>

    <div id="paymentPage" class="container hidden">
        <h2>Trip Summary & Payment</h2>
        <div class="trip-summary" id="tripSummary"></div>

        <form id="paymentForm">
            <label for="amount">Amount to Pay (₹)</label>
            <input type="number" id="amount" readonly required>

            <label for="paymentMethod">Payment Method</label>
            <select id="paymentMethod" required>
                <option value="">-- Select --</option>
                <option value="upi">UPI</option>
                <option value="card">Credit/Debit Card</option>
                <option value="cash">Cash</option>
            </select>

            <label for="txnId">Transaction ID (if applicable)</label>
            <input type="text" id="txnId" placeholder="Enter Transaction ID">

            <button type="submit" class="primary-btn">Confirm Payment</button>
        </form>
    </div>

    <script>
        // Global state
        let trips = JSON.parse(localStorage.getItem('trips')) || [];
        let selectedTrip = null;

        // DOM elements
        const createTripBtn = document.getElementById('createTripBtn');
        const searchTripsBtn = document.getElementById('searchTripsBtn');
        const createTripSection = document.getElementById('createTripSection');
        const searchTripsSection = document.getElementById('searchTripsSection');
        const paymentPage = document.getElementById('paymentPage');
        const tripForm = document.getElementById('tripForm');
        const searchDestInput = document.getElementById('searchDest');
        const resultsDiv = document.getElementById('results');
        const tripSummaryDiv = document.getElementById('tripSummary');
        const paymentForm = document.getElementById('paymentForm');
        const amountInput = document.getElementById('amount');

        // Helper function for alerts
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert-message alert-${type}`;
            alertDiv.textContent = message;
            document.querySelector('.container').prepend(alertDiv);
            setTimeout(() => alertDiv.remove(), 4000);
        }

        // Tab switching logic
        createTripBtn.addEventListener('click', () => {
            createTripBtn.classList.add('active');
            searchTripsBtn.classList.remove('active');
            createTripSection.classList.remove('hidden');
            searchTripsSection.classList.add('hidden');
            paymentPage.classList.add('hidden');
        });

        searchTripsBtn.addEventListener('click', () => {
            searchTripsBtn.classList.add('active');
            createTripBtn.classList.remove('active');
            searchTripsSection.classList.remove('hidden');
            createTripSection.classList.add('hidden');
            paymentPage.classList.add('hidden');
        });

        // Trip creation
        tripForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const newTrip = { 
                id: Date.now(), 
                origin: document.getElementById('origin').value,
                destination: document.getElementById('destination').value,
                date: document.getElementById('date').value,
                seats: parseInt(document.getElementById('seats').value),
                cost: parseFloat(document.getElementById('cost').value),
                vehicleNumber: document.getElementById('vehicleNumber').value,
                vehicleType: document.getElementById('vehicleType').value,
                contactNumber: document.getElementById('contactNumber').value
            };

            trips.push(newTrip);
            localStorage.setItem('trips', JSON.stringify(trips));
            showAlert('✅ Trip Created Successfully!', 'success');
            tripForm.reset();
        });

        // Search trips
        function searchTrips() {
            const dest = searchDestInput.value.toLowerCase();
            resultsDiv.innerHTML = '';

            const results = trips.filter(t => t.destination.toLowerCase().includes(dest));

            if (results.length === 0) {
                resultsDiv.innerHTML = '<p>No trips found.</p>';
                return;
            }

            results.forEach(t => {
                const tripDiv = document.createElement('div');
                tripDiv.className = 'trip-card';
                tripDiv.innerHTML = `
                    <p><strong>From:</strong> ${t.origin}</p>
                    <p><strong>To:</strong> ${t.destination}</p>
                    <p><strong>Date:</strong> ${new Date(t.date).toLocaleString()}</p>
                    <p><strong>Seats Available:</strong> ${t.seats}</p>
                    <p><strong>Cost per Seat:</strong> ₹${t.cost.toFixed(2)}</p>
                    <p><strong>Vehicle:</strong> ${t.vehicleType} (${t.vehicleNumber})</p>
                    <p><strong>Contact:</strong> ${t.contactNumber}</p>
                    <button class="join-btn" onclick="joinTrip(${t.id})">Request to Join</button>
                `;
                resultsDiv.appendChild(tripDiv);
            });
        }

        // Join trip (navigate to payment page)
        function joinTrip(id) {
            const trip = trips.find(t => t.id === id);
            if (!trip) {
                showAlert('❌ Trip not found.', 'danger');
                return;
            }

            if (trip.seats > 0) {
                selectedTrip = trip;
                createTripSection.classList.add('hidden');
                searchTripsSection.classList.add('hidden');
                paymentPage.classList.remove('hidden');

                // Update trip summary and payment amount
                tripSummaryDiv.innerHTML = `
                    <p><strong>From:</strong> ${trip.origin}</p>
                    <p><strong>To:</strong> ${trip.destination}</p>
                    <p><strong>Date:</strong> ${new Date(trip.date).toLocaleString()}</p>
                    <p><strong>Seats Booked:</strong> 1</p>
                    <p><strong>Cost:</strong> ₹${trip.cost.toFixed(2)}</p>
                    <p><strong>Vehicle:</strong> ${trip.vehicleType} (${trip.vehicleNumber})</p>
                    <p><strong>Driver Contact:</strong> ${trip.contactNumber}</p>
                `;
                amountInput.value = trip.cost.toFixed(2);
            } else {
                showAlert('❌ No seats available.', 'danger');
            }
        }

        // Handle payment
        paymentForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (!selectedTrip) {
                showAlert('❌ No trip selected.', 'danger');
                return;
            }

            // Decrement seats and save to local storage
            selectedTrip.seats -= 1;
            localStorage.setItem('trips', JSON.stringify(trips));

            const amount = amountInput.value;
            const method = document.getElementById('paymentMethod').value;
            const txnId = document.getElementById('txnId').value;

            showAlert(`✅ Payment Successful for ₹${amount}!`, 'success');

            // Go back to the search page
            paymentPage.classList.add('hidden');
            searchTripsBtn.click(); // Simulate click to show the search tab
            searchTrips(); // Refresh the search results
            paymentForm.reset();
            selectedTrip = null;
        });

        // Initial load
        window.onload = () => {
            createTripBtn.click(); // Default to the create trip tab
        };
    </script>
</body>
</html>
