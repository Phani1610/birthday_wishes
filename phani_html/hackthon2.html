<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TripShare - Ride Sharing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fa;
      margin: 0;
      padding: 0;
    }
    header {
      background: #2c3e50;
      color: white;
      padding: 15px;
      text-align: center;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 { color: #2c3e50; }
    label { display: block; margin: 8px 0 4px; }
    input, select, button {
      width: 100%; padding: 10px; margin-bottom: 12px;
      border: 1px solid #ccc; border-radius: 6px;
    }
    button {
      background: #27ae60; color: white; font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #219150; }
    .trip {
      border: 1px solid #ddd; padding: 15px; margin: 10px 0;
      border-radius: 6px; background: #f9f9f9;
    }
    .trip strong { color: #2c3e50; }
    .hidden { display: none; }
    .trip-summary {
      background: #f9f9f9; padding: 15px; border-radius: 6px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🚗 TripShare - Ride Sharing</h1>
    <p>Share your ride or find one easily</p>
  </header>

  <!-- Home Page (Trip creation & search) -->
  <div id="homePage" class="container">
    <h2>Create a Trip</h2>
    <form id="tripForm">
      <label>Origin</label>
      <input type="text" id="origin" required>

      <label>Destination</label>
      <input type="text" id="destination" required>

      <label>Date & Time</label>
      <input type="datetime-local" id="date" required>

      <label>Seats Available</label>
      <input type="number" id="seats" min="1" required>

      <button type="submit">Create Trip</button>
    </form>
  </div>

  <div id="searchPage" class="container">
    <h2>Search Trips</h2>
    <input type="text" id="searchDest" placeholder="Enter destination...">
    <button onclick="searchTrips()">Search</button>
    <div id="results"></div>
  </div>

  <!-- Payment Page -->
  <div id="paymentPage" class="container hidden">
    <h2>Trip Summary</h2>
    <div class="trip-summary" id="tripSummary"></div>

    <h2>Payment Details</h2>
    <form id="paymentForm">
      <label>Amount (₹)</label>
      <input type="number" id="amount" required>

      <label>Payment Method</label>
      <select id="paymentMethod" required>
        <option value="">-- Select --</option>
        <option value="upi">UPI</option>
        <option value="card">Credit/Debit Card</option>
        <option value="cash">Cash</option>
      </select>

      <label>Transaction ID (if applicable)</label>
      <input type="text" id="txnId" placeholder="Enter Transaction ID">

      <button type="submit">Confirm Payment</button>
    </form>
  </div>

  <script>
    let trips = JSON.parse(localStorage.getItem('trips')) || [];
    let selectedTrip = null;

    // Trip creation
    document.getElementById('tripForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const origin = document.getElementById('origin').value;
      const destination = document.getElementById('destination').value;
      const date = document.getElementById('date').value;
      const seats = document.getElementById('seats').value;

      const newTrip = { id: Date.now(), origin, destination, date, seats };
      trips.push(newTrip);
      localStorage.setItem('trips', JSON.stringify(trips));

      alert('✅ Trip Created Successfully!');
      document.getElementById('tripForm').reset();
    });

    // Search trips
    function searchTrips() {
      const dest = document.getElementById('searchDest').value.toLowerCase();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      const results = trips.filter(t => t.destination.toLowerCase().includes(dest));

      if (results.length === 0) {
        resultsDiv.innerHTML = '<p>No trips found.</p>';
        return;
      }

      results.forEach(t => {
        const tripDiv = document.createElement('div');
        tripDiv.className = 'trip';
        tripDiv.innerHTML = `
          <p><strong>From:</strong> ${t.origin}</p>
          <p><strong>To:</strong> ${t.destination}</p>
          <p><strong>Date:</strong> ${t.date}</p>
          <p><strong>Seats Available:</strong> ${t.seats}</p>
          <button onclick="joinTrip(${t.id})">Request to Join</button>
        `;
        resultsDiv.appendChild(tripDiv);
      });
    }

    // Join trip → go to payment
    function joinTrip(id) {
      const trip = trips.find(t => t.id === id);
      if (trip.seats > 0) {
        trip.seats -= 1;
        localStorage.setItem('trips', JSON.stringify(trips));
        selectedTrip = trip;

        // Show payment page
        document.getElementById('homePage').classList.add('hidden');
        document.getElementById('searchPage').classList.add('hidden');
        document.getElementById('paymentPage').classList.remove('hidden');

        // Show trip summary
        document.getElementById('tripSummary').innerHTML = `
          <p><strong>From:</strong> ${trip.origin}</p>
          <p><strong>To:</strong> ${trip.destination}</p>
          <p><strong>Date:</strong> ${trip.date}</p>
          <p><strong>Seats Booked:</strong> 1</p>
        `;
        document.getElementById('amount').value = 200; // Fixed price per seat
      } else {
        alert('❌ No seats available.');
      }
    }

    // Handle payment
    document.getElementById('paymentForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const amount = document.getElementById('amount').value;
      const method = document.getElementById('paymentMethod').value;
      const txnId = document.getElementById('txnId').value;

      alert(`✅ Payment Successful!\nAmount: ₹${amount}\nMethod: ${method}\nTransaction ID: ${txnId}`);

      // Reset and go back to homepage
      selectedTrip = null;
      document.getElementById('paymentForm').reset();
      document.getElementById('paymentPage').classList.add('hidden');
      document.getElementById('homePage').classList.remove('hidden');
      document.getElementById('searchPage').classList.remove('hidden');
    });
  </script>
</body>
</html>
