<!DOCTYPE html>
<html>
<head>
<title>Smart Communication Assistant - Home</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    height:100vh;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
}

/* Moon */
.moon{
    position:absolute;
    top:50px;
    right:80px;
    width:120px;
    height:120px;
    background: radial-gradient(circle at 30% 30%,#fff,#ccc);
    border-radius:50%;
    box-shadow:0 0 60px rgba(255,255,255,0.6);
    animation: floatMoon 6s ease-in-out infinite;
}

@keyframes floatMoon{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-15px);}
    100%{transform:translateY(0px);}
}

/* Stars */
.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation: twinkle 2s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{opacity:0.2;}
    50%{opacity:1;}
}

/* Glass Container */
.container{
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border-radius:15px;
    padding:25px;
    width:340px;
    margin:15px;
    box-shadow:0 0 25px rgba(0,0,0,0.6);
    animation: fadeIn 1.2s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

h2{
    margin-bottom:20px;
    text-shadow:0 0 10px rgba(255,255,255,0.6);
}

h3{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    outline:none;
    background:rgba(255,255,255,0.15);
    color:white;
}

input::placeholder{
    color:#ddd;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background: linear-gradient(45deg,#00c6ff,#0072ff);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.4s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #00c6ff;
}

.message{
    margin-top:15px;
    color:#ff6b6b;
    font-weight:bold;
}

/* Floating Kids Icons */
.kids{
    position:absolute;
    bottom:20px;
    left:20px;
    font-size:40px;
    animation: floatKids 5s ease-in-out infinite;
}

@keyframes floatKids{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

</style>
</head>
<body>

<div class="moon"></div>

<!-- Random Stars -->
<script>
for(let i=0;i<60;i++){
    let star=document.createElement("div");
    star.className="star";
    star.style.top=Math.random()*100+"%";
    star.style.left=Math.random()*100+"%";
    star.style.animationDuration=(Math.random()*3+1)+"s";
    document.body.appendChild(star);
}
</script>

<h2>🌙 Smart Communication Assistant</h2>

<div class="container">
<h3>🆕 First Time User (Signup)</h3>
<input type="text" id="signupName" placeholder="Enter Name">
<input type="text" id="signupPhone" placeholder="Enter Phone">
<button onclick="signup()">Sign Up</button>
</div>

<div class="container">
<h3>🔑 Already User (Login)</h3>
<input type="text" id="loginPhone" placeholder="Enter Phone">
<button onclick="login()">Login</button>
</div>

<p class="message" id="homeMessage"></p>

<div class="kids">👦 👧 ✨</div>

<script>
function signup(){
    const name=document.getElementById("signupName").value;
    const phone=document.getElementById("signupPhone").value;

    fetch("/signup",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name,phone})
    }).then(res=>res.json())
    .then(data=>{
        document.getElementById("homeMessage").innerText=data.message;
        if(data.message==="Signup successful"){
            localStorage.setItem("currentUser",name);
            window.location.href="/app";
        }
    });
}

function login(){
    const phone=document.getElementById("loginPhone").value;

    fetch("/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({phone})
    }).then(res=>res.json())
    .then(data=>{
        document.getElementById("homeMessage").innerText=data.message;
        if(data.message==="Login successful"){
            localStorage.setItem("currentUser",data.name);
            window.location.href="/app";
        }
    });
}
</script>

</body>
</html>
