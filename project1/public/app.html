function showSection(id) {

/* ================= VOICE RECOGNITION ================= */


let recognition = null;
let isListening = false;
let correctedSentence = "";
let lastTranscript = "";   // prevent duplicate words

function initSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Please use Google Chrome.");
        return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "en-US";

    recognition.continuous = false;      // 🔥 IMPORTANT FIX
    recognition.interimResults = false;

    recognition.onresult = function (event) {
        let transcript = event.results[0][0].transcript.trim();

        // 🔥 Prevent duplicate text
        if (transcript !== lastTranscript) {
            const input = document.getElementById("inputText");
            if (input) input.value += transcript + " ";
            lastTranscript = transcript;
        }
    };

    recognition.onerror = function (event) {
        console.error("Speech error:", event.error);
        isListening = false;
    };

    recognition.onend = function () {
        isListening = false;
    };
}

function startListening() {
    if (!recognition) initSpeech();

    if (recognition && !isListening) {
        lastTranscript = "";  // reset duplicate memory
        recognition.start();
        isListening = true;
    }
}

function stopListening() {
    if (recognition && isListening) {
        recognition.stop();
        isListening = false;
    }
}


/* ================= GRAMMAR CHECK ================= */
let lastCheckTime = 0;

async function checkGrammar() {

    const now = Date.now();

    if (now - lastCheckTime < 2000) {
        alert("Please wait 2 seconds before checking again.");
        return;
    }

    lastCheckTime = now;

    const input = document.getElementById("inputText");
    const output = document.getElementById("output");

    if (!input.value.trim()) {
        alert("Enter text first");
        return;
    }

    output.innerHTML = "Checking...";

    try {
     const response = await fetch(
    "https://corsproxy.io/?https://api.languagetool.org/v2/check",
{
    method: "POST",
    headers: {
        "Content-Type": "application/x-www-form-urlencoded"
    },
    body: "text=" + encodeURIComponent(input.value) + "&language=en-US"
});


        const data = await response.json();

        let corrected = input.value;

        if (data.matches) {
            data.matches
                .sort((a, b) => b.offset - a.offset)
                .forEach(match => {
                    if (
                        match.replacements.length > 0 &&
                        match.rule.issueType !== "misspelling"
                    ) {
                        corrected =
                            corrected.slice(0, match.offset) +
                            match.replacements[0].value +
                            corrected.slice(match.offset + match.length);
                    }
                });
        }

        output.innerHTML =
            "<span id='correctedText'>" + corrected + "</span>";

    } catch (e) {
        output.innerHTML = "Grammar service error.";
        console.error(e);
    }
}



/* ================= TEXT TO SPEECH ================= */

function speakText() {

    const correctedElement = document.getElementById("correctedText");

    if (!correctedElement) {
        alert("Please check grammar first.");
        return;
    }

    const textToSpeak = correctedElement.innerText.trim();

    if (!textToSpeak) {
        alert("No corrected text found.");
        return;
    }

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(textToSpeak);
    speech.lang = "en-US";

    window.speechSynthesis.speak(speech);
}

html+=`<button class="option" onclick="checkAnswer(${i})">${opt}</button>`;
});
document.getElementById("options").innerHTML=html;
document.getElementById("progressBar").style.width=((current/questions.length)*100)+"%";
}

current++;showQuestion();

let masterSentence="";
let masterTime=60;
let masterTimer;
let totalTyped=0;
let correctTyped=0;

function startTypeMaster(){
masterTime=60;
totalTyped=0;
correctTyped=0;
loadSentence();

masterTimer=setInterval(()=>{
masterTime--;
document.getElementById("typeTimer").innerText="Time: "+masterTime;
if(masterTime<=0) finishType();
},1000);
}

function loadSentence(){
masterSentence=sentences[Math.floor(Math.random()*sentences.length)];
document.getElementById("typeSentence").innerText=masterSentence;
document.getElementById("typeInput").value="";
}

document.getElementById("typeInput").addEventListener("input",function(){
let typed=this.value;
totalTyped=typed.length;

correctTyped=0;
for(let i=0;i<typed.length;i++){
if(typed[i]===masterSentence[i]) correctTyped++;
}

if(typed===masterSentence) loadSentence();
});

function finishType(){
clearInterval(masterTimer);
let wpm=Math.round((correctTyped/5));
let accuracy=Math.round((correctTyped/totalTyped)*100)||0;

document.getElementById("typeStats").innerHTML=
"Speed: "+wpm+" WPM<br>Accuracy: "+accuracy+"%";
}
